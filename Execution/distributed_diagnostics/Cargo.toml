[package]
name = "distributed_diagnostics"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "distributed_diagnostics"
path = "src/main.rs"

[lib]
name = "distributed_diagnostics"
path = "src/lib.rs"

[dependencies]
config       = "0.14"
dotenvy      = "0.15"
clap         = { version = "4", features = ["derive"] }
thiserror    = "1"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
reqwest      = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio        = { version = "1", features = ["full"] }
async-trait  = "0.1"
backon       = "1"
url          = "2"
sqlx         = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "chrono", "json"] }
chrono       = { version = "0.4", features = ["serde"] }
jsonschema   = "0.26"
strum        = { version = "0.26", features = ["derive"] }
strum_macros = "0.26"
tokenizers   = { version = "0.21", default-features = false, features = ["fancy-regex"] }
opentelemetry = { version = "0.31", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.31.1", default-features = false, features = ["trace", "metrics", "grpc-tonic"] }
opentelemetry_sdk = { version = "0.31", features = ["trace", "metrics", "rt-tokio"] }
tracing = "0.1"
tracing-opentelemetry = "0.32.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"
tokio    = { version = "1", features = ["full", "io-util", "net"] }
