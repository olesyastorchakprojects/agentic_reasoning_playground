[runtime]
config_version = "v1"

[retrieval.cards]
top_k = 8
score_threshold = 0.2
max_alternatives = 2

[retrieval.cards.embedding_retry]
max_attempts = 3
backoff = "exponential"

[retrieval.cards.qdrant_retry]
max_attempts = 3
backoff = "exponential"

[retrieval.practice]
top_k = 12
score_threshold = 0.2
max_alternatives = 2

[retrieval.practice.embedding_retry]
max_attempts = 3
backoff = "exponential"

[retrieval.practice.qdrant_retry]
max_attempts = 3
backoff = "exponential"

[retrieval.theory]
top_k = 12
score_threshold = 0.2
max_alternatives = 2

[retrieval.theory.embedding_retry]
max_attempts = 3
backoff = "exponential"

[retrieval.theory.qdrant_retry]
max_attempts = 3
backoff = "exponential"

[input_normalization]
max_input_tokens = 3000
tokenizer_source = "Qwen/Qwen3-Embedding-0.6B"

[query_structuring]
controlled_vocabulary_path = "/home/olesia/code/dist_sys_assistant/Specification/runtime/request_pipeline/query_structuring_controlled_vocabulary.manual_test.json"
prompt_asset_path = "/home/olesia/code/dist_sys_assistant/Specification/runtime/request_pipeline/query_structuring_prompt_baseline_v2.manual_test.json"
max_output_tokens = 2200

[observation_boundary_resolver]
provider = "together"
model = "openai/gpt-oss-20b"
prompt_asset_path = "/home/olesia/code/dist_sys_assistant/Specification/runtime/request_pipeline/observation_boundary_resolver/observation_boundary_resolver_prompt_baseline.manual_test.json"
max_output_tokens = 600

[observation_extraction]
provider = "together"
model = "openai/gpt-oss-20b"
prompt_asset_path = "/home/olesia/code/dist_sys_assistant/Specification/runtime/request_pipeline/observation_extraction/observation_extraction_prompt_baseline.manual_test.json"
max_output_tokens = 600

[incident_evidence_retrieval.retrieval]
top_k = 12
score_threshold = 0.2
max_alternatives = 2

[incident_evidence_retrieval.retrieval.embedding_retry]
max_attempts = 3
backoff = "exponential"

[incident_evidence_retrieval.retrieval.qdrant_retry]
max_attempts = 3
backoff = "exponential"

[incident_evidence_retrieval.profiles.initial]
primary_tags = [
  "chunk_role:symptom",
  "chunk_role:impact",
  "chunk_role:timeline",
  "chunk_role:symptom_change",
  "chunk_role:investigation",
  "chunk_role:diagnostic_step",
  "chunk_role:hypothesis_update",
  "chunk_role:recovery",
]
alternative_tags = [
  "chunk_role:failure_mode",
  "chunk_role:root_cause",
  "chunk_role:contributing_factor",
  "chunk_role:uncertainty",
  "chunk_role:lesson",
]

[incident_evidence_retrieval.profiles.continuation]
primary_tags = [
  "chunk_role:symptom",
  "chunk_role:symptom_change",
  "chunk_role:investigation",
  "chunk_role:diagnostic_step",
  "chunk_role:hypothesis_update",
  "chunk_role:failure_mode",
  "chunk_role:contributing_factor",
  "chunk_role:uncertainty",
]
alternative_tags = [
  "chunk_role:symptom",
  "chunk_role:failure_mode",
  "chunk_role:contributing_factor",
  "chunk_role:uncertainty",
  "chunk_role:diagnostic_step",
]

[prompt_context]
prompt_asset_path = "/home/olesia/code/dist_sys_assistant/Specification/runtime/request_pipeline/prompt_context_assembly/diagnostic_response_prompt_baseline.manual_test.json"

[prompt_context.chunk_packing.evidence_for_match]
source = "primary_incident"
limit = 1
fallback_to_any_chunk = true
tag_priority = [
  "chunk_role:symptom",
  "chunk_role:failure_mode",
  "chunk_role:contributing_factor",
]

[prompt_context.chunk_packing.first_check_hint]
source = "primary_incident"
limit = 1
fallback_to_any_chunk = true
tag_priority = [
  "chunk_role:diagnostic_step",
  "chunk_role:investigation",
  "chunk_role:lesson",
]

[prompt_context.chunk_packing.supporting_explanation]
source = "primary_incident"
limit = 1
fallback_to_any_chunk = false
tag_priority = [
  "chunk_role:failure_mode",
  "chunk_role:contributing_factor",
  "chunk_role:uncertainty",
  "chunk_role:hypothesis_update",
]

[prompt_context.chunk_packing.alternative_context]
source = "alternative_incident"
limit = 2
per_case_limit = 1
fallback_to_any_chunk = false
tag_priority = [
  "chunk_role:symptom",
  "chunk_role:failure_mode",
  "chunk_role:uncertainty",
]

[prompt_context.chunk_packing.mechanism_explanation]
source = "theory"
limit = 1
fallback_to_any_chunk = false
tag_priority = []

[diagnostic_update_prompt_context]
prompt_asset_path = "/home/olesia/code/dist_sys_assistant/Specification/runtime/request_pipeline/diagnostic_update_prompt_context_assembly/diagnostic_update_response_prompt_baseline.manual_test.json"

[diagnostic_update_prompt_context.chunk_packing.evidence_for_match]
source = "primary_incident"
limit = 1
fallback_to_any_chunk = true
tag_priority = [
  "chunk_role:symptom",
  "chunk_role:symptom_change",
  "chunk_role:failure_mode",
  "chunk_role:investigation",
  "chunk_role:hypothesis_update",
]

[diagnostic_update_prompt_context.chunk_packing.next_check_hint]
source = "primary_incident"
limit = 1
fallback_to_any_chunk = true
tag_priority = [
  "chunk_role:diagnostic_step",
  "chunk_role:investigation",
  "chunk_role:hypothesis_update",
  "chunk_role:lesson",
]

[diagnostic_update_prompt_context.chunk_packing.supporting_explanation]
source = "primary_incident"
limit = 1
fallback_to_any_chunk = false
tag_priority = [
  "chunk_role:failure_mode",
  "chunk_role:contributing_factor",
  "chunk_role:uncertainty",
  "chunk_role:hypothesis_update",
]

[diagnostic_update_prompt_context.chunk_packing.alternative_context]
source = "alternative_incident"
limit = 2
per_case_limit = 1
fallback_to_any_chunk = false
tag_priority = [
  "chunk_role:symptom",
  "chunk_role:failure_mode",
  "chunk_role:uncertainty",
  "chunk_role:diagnostic_step",
]

[diagnostic_update_prompt_context.chunk_packing.mechanism_explanation]
source = "theory"
limit = 1
fallback_to_any_chunk = false
tag_priority = []

[llm_structured_generation]
max_output_tokens = 6000

[model]
transport_kind = "together"

[model.ollama]
model_name = "qwen2.5:1.5b-instruct-ctx32k"
timeout_sec = 120
input_cost_per_million_tokens = 0.00
output_cost_per_million_tokens = 0.00

[model.ollama.retry]
max_attempts = 3
backoff = "exponential"

[model.together]
model_name = "openai/gpt-oss-20b"
timeout_sec = 120
input_cost_per_million_tokens = 0.05
output_cost_per_million_tokens = 0.20

[model.together.retry]
max_attempts = 3
backoff = "exponential"

[observability]
tracing_enabled = true
metrics_enabled = true
trace_batch_scheduled_delay_ms = 2000
metrics_export_interval_ms = 1000

[chunk_audit_log]
path = "chunk_audit.log.jsonl"
