[package]
name = "distributed_diagnostics_eval"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "distributed_diagnostics_eval"
path = "src/main.rs"

[lib]
name = "distributed_diagnostics_eval"
path = "src/lib.rs"

[dependencies]
distributed_diagnostics = { path = "../distributed_diagnostics" }
clap = { version = "4", features = ["derive"] }
config = "0.14"
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "chrono", "json", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
async-trait = "0.1"
url = "2"

[dev-dependencies]
tempfile = "3"
