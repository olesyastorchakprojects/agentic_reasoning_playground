case_id: mongodb_4_2_6_jepsen_2020_05_15
title: "MongoDB 4.2.6 Jepsen analysis: transactional anomalies, weak defaults, and snapshot-isolation gaps"
source_type: "jepsen_report"
source_name: "Jepsen"
source_path: "practice_corpus/raw/mongodb-4.2.6.pdf"
vendor_or_project: "MongoDB"
system_type: "distributed document database"
version_tested: "4.2.6"
report_date: "2020-05-15"

short_summary: >
  Jepsen found that MongoDB 4.2.6 could violate snapshot-isolation expectations even at strong read and write
  concern settings, while weak defaults made behavior much worse by allowing lost writes, dirty reads, and
  downgraded safety in transactional contexts. The core practical danger was that users could believe they were
  running safe ACID-style transactions while key safety assumptions silently depended on explicit per-transaction settings.

canonical_symptoms:
  - "lost_writes"
  - "dirty_reads"
  - "read_skew"
  - "duplicate_writes"
  - "cyclic_information_flow"
  - "snapshot_isolation_violation"
  - "transaction_retry_anomalies"
  - "downgraded_transaction_safety"
affected_components:
  - "transaction_api"
  - "read_concern"
  - "write_concern"
  - "session_defaults"
  - "retry_mechanism"
  - "sharded_or_replicated_cluster_behavior"
failure_mode_candidates:
  - "weak_default_read_write_concerns"
  - "transaction_level_settings_override_safer_handles"
  - "snapshot_read_without_majority_write"
  - "transaction_retry_bug"
  - "network_partition_exposes_transactional_anomalies"
observed_phases:
  - "healthy_cluster_baseline"
  - "transaction_execution"
  - "network_partition"
  - "retry_or_timeout_handling"
  - "post_fault_analysis"

incident_phases:
  - phase_name: "baseline_without_transactional_stress"
    context: >
      With carefully chosen strong settings for single-operation reads and writes, behavior could appear
      consistent enough to suggest MongoDB was safe when configured conservatively.
    symptoms:
      - "baseline operations may look consistent under strong concerns"
    user_visible_impact:
      - "operators may believe stronger safety settings are already applied everywhere"
    observations:
      - "healthy clusters under strong read/write concern could appear compatible with snapshot isolation"
    actions_taken:
      - "run baseline tests with strong concern settings"
    changes_after_actions:
      - "focus shifts to multi-operation transactions and faulted conditions"

  - phase_name: "transactional_execution_under_defaults_or_implicit_downgrades"
    context: >
      Once operations were wrapped in transactions, MongoDB's behavior depended heavily on transaction-level
      read and write concern, and safer database/collection-level settings did not carry over as users might expect.
    symptoms:
      - "transactions can lose writes"
      - "transactions can allow dirty or non-snapshot reads"
      - "users think snapshot or ACID behavior is active when it is not"
    user_visible_impact:
      - "applications may silently run weaker-than-expected transactional safety"
      - "read-only transactions may still fail to observe a majority-committed snapshot"
    observations:
      - "transactions defaulted to weaker effective safety unless concerns were set per transaction"
      - "read concern snapshot did not guarantee snapshot isolation without write concern majority"
    actions_taken:
      - "wrap workloads in transactions"
      - "compare behavior under database/session defaults versus explicit transaction settings"
    changes_after_actions:
      - "problem moves from 'MongoDB supports transactions' to 'transaction safety is conditional and easy to misconfigure'"

  - phase_name: "fault_injection_and_partition_behavior"
    context: >
      Under network partitions and transaction retries/timeouts, Jepsen observed more severe anomalies including
      lost acknowledged writes, duplicate writes, read skew, and cyclic information flow.
    symptoms:
      - "lost acknowledged writes"
      - "duplicate writes"
      - "read skew"
      - "cyclic information flow"
      - "internal consistency anomalies"
    user_visible_impact:
      - "state can become inconsistent even when operators believe they chose strong settings"
      - "transactional guarantees degrade most when the system is stressed"
    observations:
      - "snapshot isolation was violated"
      - "network partitions could trigger transactional anomalies"
      - "some anomalies may have been tied to the transaction retry mechanism"
    actions_taken:
      - "inject network faults"
      - "analyze transaction dependency cycles and duplicate effects"
    changes_after_actions:
      - "diagnosis narrows to transactional protocol behavior, especially under faults and retries"

  - phase_name: "vendor_followup_and_operational_interpretation"
    context: >
      MongoDB identified a likely retry-mechanism bug and scheduled a patch, but the report emphasized that
      even documented behavior and defaults were already risky for users.
    symptoms:
      - "operators remain exposed even if a specific bug is fixed"
      - "documentation-compliant usage can still be surprising or unsafe"
    user_visible_impact:
      - "fixing one retry bug does not remove the danger of weak defaults and confusing API semantics"
    observations:
      - "patch for retry-mechanism bug was scheduled for 4.2.8"
      - "weak defaults and transaction-level override behavior remained a major practical risk"
    actions_taken:
      - "separate bug-specific findings from broader API and default-safety concerns"
    changes_after_actions:
      - "final lesson becomes configuration and semantics awareness, not only bug remediation"

turning_points:
  - "Strong-looking baseline behavior did not survive transactional and faulted scenarios."
  - "The key operational surprise was that safer collection/database settings did not automatically protect transactions."
  - "Network partitions and retries turned a configuration-risk story into an explicit anomaly story."

candidate_explanations:
  - "The incident is driven by weak default read/write concern rather than a single storage-engine failure."
  - "Users are relying on snapshot or ACID expectations without setting transaction-level safety correctly."
  - "Retry-handling bugs amplify already confusing transactional semantics under faults."
  - "The main issue is transaction API behavior under partitions, not ordinary single-document reads/writes alone."

diagnostic_patterns:
  - >
    healthy cluster with strong-looking baseline -> introduce transactions -> safety unexpectedly weakens because
    transaction-level settings differ from assumed defaults
  - >
    transaction workload + network partition or retry/timeout -> lost writes, duplicate effects, or snapshot anomalies
  - >
    read concern snapshot without majority write concern -> apparent snapshot semantics fail even for read-only flows

discriminating_checks:
  - question: "Are read concern and write concern being set explicitly on each transaction, or only at database/session/collection level?"
    why: "Separates configuration-induced weakness from deeper transaction-engine bugs."
  - question: "Do anomalies appear only during partitions, retries, or timeouts, or also in healthy clusters?"
    why: "Distinguishes fault-triggered anomalies from always-on semantic weakness."
  - question: "Are read-only snapshot transactions missing majority write concern assumptions?"
    why: "Tests for the specific snapshot-without-majority trap."
  - question: "Are duplicated effects correlated with retry behavior or ambiguous transaction error handling?"
    why: "Checks whether retry-path handling is amplifying the issue."

expected_observations:
  - observation: "Problems disappear when every transaction explicitly uses strong read/write concern."
    effect: "Strengthen weak_default_read_write_concerns and transaction_level_settings_override_safer_handles."
  - observation: "Anomalies spike under network partitions, retries, or timeouts."
    effect: "Strengthen network_partition_exposes_transactional_anomalies and transaction_retry_bug."
  - observation: "Read-only snapshot transactions still fail without write concern majority."
    effect: "Strengthen snapshot_read_without_majority_write."
  - observation: "Single-document operations remain comparatively safe while multi-operation transactions fail."
    effect: "Strengthen transaction_api as primary failure surface."

investigation_steps:
  - "Audit actual effective read/write concern on every transaction, not just on client handles or collections."
  - "Separate single-document behavior from multi-operation transactional behavior."
  - "Correlate anomalies with partitions, retries, timeouts, and ambiguous error codes."
  - "Check whether read-only snapshot users implicitly depend on majority-committed views they are not guaranteed."
  - "Review whether the application really needs snapshot isolation or stronger semantics than MongoDB safely provides here."

root_cause_summary: >
  MongoDB 4.2.6 transactional safety was undermined by a combination of weak defaults, surprising transaction-level
  concern semantics, snapshot behavior that required write concern majority even for some read-only expectations,
  and at least one likely retry-related bug exposed under faults.

reasoning_summary: >
  The report's most important lesson is not just that MongoDB had transactional anomalies, but that users could
  easily believe they were protected when they were not. Jepsen showed that explicit per-transaction read/write
  concern mattered, that snapshot expectations could fail under documented-but-surprising conditions, and that
  partitions and retries exposed duplicate writes, read skew, cyclic information flow, and lost acknowledged writes.

mitigations_or_workarounds:
  - "Set read and write concern explicitly on each transaction that requires strong safety."
  - "Do not assume database- or collection-level concern settings automatically carry into transactional contexts."
  - "Treat read concern snapshot as insufficient unless the necessary write concern guarantees are also present."
  - "Audit retry handling and ambiguous transaction error paths carefully."

prevention_or_design_followups:
  - "Prefer safer defaults for transactional workloads."
  - "Add tests that specifically exercise partitions, retries, and timeouts under transaction load."
  - "Document effective concern semantics in application code, not only in operator docs."
  - "Re-evaluate whether business-critical workflows require stronger semantics than this configuration can reliably offer."

claimed_guarantees:
  - "full ACID transactions"
  - "strong data consistency and safety guarantees"
  - "snapshot-style transactional semantics"
violated_properties:
  - "snapshot isolation"
  - "fully isolated transactional behavior"
  - "durability of acknowledged writes under weak or surprising concern configurations"
